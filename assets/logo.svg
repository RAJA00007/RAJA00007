<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7B2CBF" />
      <stop offset="100%" stop-color="#9D4EDD" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" stroke="#1F293D" stroke-width="2"/>

  <!-- Subtle Outer Ring -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#primaryGlow)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>
  <circle cx="200" cy="200" r="162" fill="none" stroke="#00F0FF" stroke-width="0.75" opacity="0.2"/>

  <!-- Neural Connection Nodes -->
  <g opacity="0.5">
    <line x1="100" y1="120" x2="160" y2="100" stroke="#00F0FF" stroke-width="1" />
    <line x1="300" y1="120" x2="240" y2="100" stroke="#9D4EDD" stroke-width="1" />
    <line x1="80" y1="280" x2="150" y2="300" stroke="#7B2CBF" stroke-width="1" />
    <line x1="320" y1="280" x2="250" y2="300" stroke="#00F0FF" stroke-width="1" />
    
    <circle cx="100" cy="120" r="3" fill="#00F0FF" />
    <circle cx="300" cy="120" r="3" fill="#9D4EDD" />
    <circle cx="80" cy="280" r="3" fill="#7B2CBF" />
    <circle cx="320" cy="280" r="3" fill="#00F0FF" />
  </g>

  <!-- Monogram Logo: RR (Fused Futuristic Geometry) -->
  <g filter="url(#neonGlow)" transform="translate(45, 50)">
    <!-- First 'R' -->
    <!-- Vertical Backbone -->
    <rect x="70" y="50" width="18" height="200" rx="9" fill="url(#primaryGlow)" />
    
    <!-- Top Loop -->
    <path d="M 85 50 H 135 C 165 50 185 70 185 97.5 C 185 125 165 145 135 145 H 85 Z" fill="none" stroke="url(#primaryGlow)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Leg -->
    <path d="M 125 140 L 185 250" stroke="url(#primaryGlow)" stroke-width="18" stroke-linecap="round"/>

    <!-- Second 'R' (Mirrored Overlap Offset) -->
    <!-- Second Vertical Backbone -->
    <rect x="180" y="50" width="18" height="200" rx="9" fill="url(#accentCyan)" opacity="0.95" />
    
    <!-- Second Loop -->
    <path d="M 195 50 H 245 C 275 50 295 70 295 97.5 C 295 125 275 145 245 145 H 195 Z" fill="none" stroke="url(#accentCyan)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round" opacity="0.95"/>
    
    <!-- Second Leg -->
    <path d="M 235 140 L 295 250" stroke="url(#accentCyan)" stroke-width="18" stroke-linecap="round" opacity="0.95"/>
  </g>

  <!-- Glowing Intersect Nodes -->
  <g filter="url(#subtleGlow)">
    <circle cx="130" cy="100" r="5" fill="#FFFFFF" />
    <circle cx="240" cy="100" r="5" fill="#00F0FF" />
    <circle cx="230" cy="300" r="5" fill="#FFFFFF" />
  </g>
</svg>
