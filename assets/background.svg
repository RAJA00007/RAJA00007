<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="40%" stop-color="#0B0F19"/>
      <stop offset="80%" stop-color="#0D111E"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>

    <!-- Radial Glow Cyan -->
    <radialGradient id="glowCyan" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Radial Glow Purple -->
    <radialGradient id="glowPurple" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#7B2CBF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7B2CBF" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1E293B" stroke-width="0.75" opacity="0.4"/>
      <circle cx="60" cy="60" r="1" fill="#00F0FF" opacity="0.3"/>
    </pattern>

    <!-- Dot Mesh Pattern -->
    <pattern id="dotMesh" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#38BDF8" opacity="0.15"/>
    </pattern>

    <linearGradient id="lineGradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="lineGradPurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9D4EDD" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9D4EDD" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Base Layer -->
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>

  <!-- Ambient Light Orbs -->
  <rect width="100%" height="100%" fill="url(#glowCyan)"/>
  <rect width="100%" height="100%" fill="url(#glowPurple)"/>

  <!-- Grid Overlay -->
  <rect width="100%" height="100%" fill="url(#cyberGrid)"/>
  <rect width="100%" height="100%" fill="url(#dotMesh)"/>

  <!-- Cybernetic Geometric Vector Accents -->
  <g opacity="0.4">
    <!-- Diagonals -->
    <line x1="-100" y1="200" x2="800" y2="-100" stroke="url(#lineGradCyan)" stroke-width="1.5"/>
    <line x1="1200" y1="1180" x2="2020" y2="600" stroke="url(#lineGradPurple)" stroke-width="1.5"/>

    <!-- Neural Network Nodes & Links -->
    <g transform="translate(1400, 150)">
      <line x1="0" y1="0" x2="120" y2="80" stroke="#00F0FF" stroke-width="1" stroke-dasharray="4 4"/>
      <line x1="120" y1="80" x2="220" y2="-40" stroke="#7B2CBF" stroke-width="1"/>
      <line x1="120" y1="80" x2="180" y2="160" stroke="#00F0FF" stroke-width="1"/>

      <circle cx="0" cy="0" r="4" fill="#00F0FF"/>
      <circle cx="120" cy="80" r="6" fill="#9D4EDD"/>
      <circle cx="220" cy="-40" r="3" fill="#38BDF8"/>
      <circle cx="180" cy="160" r="4" fill="#00F0FF"/>
    </g>

    <g transform="translate(200, 750)">
      <line x1="0" y1="0" x2="150" y2="-100" stroke="#7B2CBF" stroke-width="1" stroke-dasharray="5 3"/>
      <line x1="150" y1="-100" x2="300" y2="-40" stroke="#00F0FF" stroke-width="1"/>
      <circle cx="0" cy="0" r="4" fill="#7B2CBF"/>
      <circle cx="150" cy="-100" r="5" fill="#00F0FF"/>
      <circle cx="300" cy="-40" r="3" fill="#9D4EDD"/>
    </g>
  </g>

  <!-- Vignette Border -->
  <rect width="100%" height="100%" fill="none" stroke="#0F172A" stroke-width="20" opacity="0.8"/>
</svg>
