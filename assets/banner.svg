<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>

    <!-- Text Primary Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="80%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Accent Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>

    <!-- Accent Purple Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#6A00F4"/>
    </linearGradient>

    <!-- Glassmorphic Card Fill -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161F33" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Glass Border Gradient -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#9D4EDD" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyanFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPurpleFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.4"/>
      <circle cx="40" cy="40" r="1" fill="#00F0FF" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Base Background -->
  <rect width="1500" height="500" rx="16" fill="url(#bgGrad)"/>
  <rect width="1500" height="500" rx="16" fill="url(#gridPattern)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="100" r="250" fill="#00F0FF" opacity="0.08" filter="url(#glowCyanFilter)"/>
  <circle cx="1350" cy="400" r="300" fill="#7B2CBF" opacity="0.12" filter="url(#glowPurpleFilter)"/>
  <circle cx="950" cy="80" r="180" fill="#00F0FF" opacity="0.06" filter="url(#glowCyanFilter)"/>

  <!-- Neural Network Constellation Background (Right Side) -->
  <g opacity="0.65" transform="translate(100, 0)">
    <!-- Connections -->
    <line x1="950" y1="120" x2="1100" y2="70" stroke="url(#cyanGrad)" stroke-width="1.5" opacity="0.7"/>
    <line x1="950" y1="120" x2="1050" y2="200" stroke="#38BDF8" stroke-width="1" opacity="0.5"/>
    <line x1="1100" y1="70" x2="1250" y2="130" stroke="url(#purpleGrad)" stroke-width="1.5"/>
    <line x1="1050" y1="200" x2="1250" y2="130" stroke="url(#cyanGrad)" stroke-width="1"/>
    <line x1="1050" y1="200" x2="1000" y2="330" stroke="#9D4EDD" stroke-width="1.5"/>
    <line x1="1250" y1="130" x2="1280" y2="280" stroke="url(#cyanGrad)" stroke-width="1.5"/>
    <line x1="1000" y1="330" x2="1180" y2="380" stroke="#00F0FF" stroke-width="1" opacity="0.6"/>
    <line x1="1280" y1="280" x2="1180" y2="380" stroke="url(#purpleGrad)" stroke-width="1.5"/>
    <line x1="1100" y1="70" x2="1200" y2="20" stroke="#00F0FF" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="1280" y1="280" x2="1340" y2="350" stroke="#9D4EDD" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Nodes -->
    <circle cx="950" cy="120" r="5" fill="#00F0FF" filter="url(#glowCyanFilter)"/>
    <circle cx="1100" cy="70" r="7" fill="#FFFFFF"/>
    <circle cx="1050" cy="200" r="4" fill="#38BDF8"/>
    <circle cx="1250" cy="130" r="8" fill="#00F0FF" filter="url(#glowCyanFilter)"/>
    <circle cx="1000" cy="330" r="6" fill="#9D4EDD" filter="url(#glowPurpleFilter)"/>
    <circle cx="1280" cy="280" r="7" fill="#C084FC"/>
    <circle cx="1180" cy="380" r="5" fill="#00F0FF"/>
    <circle cx="1200" cy="20" r="3" fill="#38BDF8"/>
    <circle cx="1340" cy="350" r="4" fill="#9D4EDD"/>
  </g>

  <!-- Glowing Particles Floating -->
  <g opacity="0.8">
    <circle cx="220" cy="80" r="2" fill="#00F0FF"/>
    <circle cx="140" cy="420" r="2.5" fill="#9D4EDD"/>
    <circle cx="480" cy="440" r="1.5" fill="#00F0FF"/>
    <circle cx="750" cy="60" r="2" fill="#FFFFFF"/>
    <circle cx="880" cy="430" r="2.5" fill="#00F0FF"/>
    <circle cx="1380" cy="120" r="2" fill="#A855F7"/>
  </g>

  <!-- Main Left Content Glassmorphic Container -->
  <g transform="translate(80, 60)">
    <!-- Glass Card -->
    <rect x="0" y="0" width="840" height="380" rx="20" fill="url(#glassGrad)" stroke="url(#glassBorder)" stroke-width="1.5"/>

    <!-- Top Badge / Status Pill -->
    <g transform="translate(40, 36)">
      <rect x="0" y="0" width="220" height="32" rx="16" fill="#091322" stroke="#00F0FF" stroke-width="1" opacity="0.9"/>
      <circle cx="16" cy="16" r="4" fill="#00F0FF" filter="url(#glowCyanFilter)"/>
      <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#00F0FF" letter-spacing="1.5">SENIOR AI ENGINEER</text>
    </g>

    <!-- Main Title (Name) -->
    <text x="40" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="url(#textGrad)" letter-spacing="2">RAJA KUMAR RAUT</text>

    <!-- Subtitle (Role & Specialties) -->
    <text x="40" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94A3B8" letter-spacing="0.5">
      AI Engineer <tspan fill="#00F0FF">|</tspan> Machine Learning <tspan fill="#00F0FF">|</tspan> Generative AI <tspan fill="#00F0FF">|</tspan> Agentic AI
    </text>

    <!-- Decorative Accent Line -->
    <rect x="40" y="192" width="500" height="2" rx="1" fill="url(#cyanGrad)"/>

    <!-- Core Specializations Highlights -->
    <g transform="translate(40, 218)">
      <!-- Item 1: Multi-Agent Systems -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="230" height="42" rx="10" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
        <circle cx="20" cy="21" r="5" fill="#00F0FF"/>
        <text x="34" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Autonomous Agents &amp; RAG</text>
      </g>

      <!-- Item 2: Computer Vision -->
      <g transform="translate(245, 0)">
        <rect x="0" y="0" width="230" height="42" rx="10" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
        <circle cx="20" cy="21" r="5" fill="#9D4EDD"/>
        <text x="34" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Multimodal Vision &amp; SAR</text>
      </g>

      <!-- Item 3: Full-Stack MLOps -->
      <g transform="translate(490, 0)">
        <rect x="0" y="0" width="240" height="42" rx="10" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
        <circle cx="20" cy="21" r="5" fill="#38BDF8"/>
        <text x="34" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">Full-Stack AI &amp; Production API</text>
      </g>
    </g>

    <!-- Key Metrics / Tech Stack Pills -->
    <g transform="translate(40, 285)">
      <!-- PyTorch -->
      <rect x="0" y="0" width="95" height="28" rx="14" fill="#1E1E2E" stroke="#FF6F00" stroke-width="1"/>
      <text x="47.5" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#FF6F00">PyTorch</text>

      <!-- FastAPI -->
      <rect x="105" y="0" width="90" height="28" rx="14" fill="#1E1E2E" stroke="#009688" stroke-width="1"/>
      <text x="150" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#009688">FastAPI</text>

      <!-- LangChain -->
      <rect x="205" y="0" width="105" height="28" rx="14" fill="#1E1E2E" stroke="#1C3C3C" stroke-width="1"/>
      <text x="257.5" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#38BDF8">LangChain</text>

      <!-- Next.js -->
      <rect x="320" y="0" width="90" height="28" rx="14" fill="#1E1E2E" stroke="#475569" stroke-width="1"/>
      <text x="365" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Next.js</text>

      <!-- OpenCV -->
      <rect x="420" y="0" width="90" height="28" rx="14" fill="#1E1E2E" stroke="#5C3EE8" stroke-width="1"/>
      <text x="465" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#A855F7">OpenCV</text>

      <!-- Docker -->
      <rect x="520" y="0" width="85" height="28" rx="14" fill="#1E1E2E" stroke="#2496ED" stroke-width="1"/>
      <text x="562.5" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#2496ED">Docker</text>

      <!-- Earth Engine -->
      <rect x="615" y="0" width="115" height="28" rx="14" fill="#1E1E2E" stroke="#34D399" stroke-width="1"/>
      <text x="672.5" y="18" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#34D399">Earth Engine</text>
    </g>
  </g>

  <!-- Right Visual Highlight Emblem (RR Monogram Accent Badge) -->
  <g transform="translate(1080, 110)">
    <!-- Outer Glow Ring -->
    <circle cx="150" cy="140" r="120" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
    <circle cx="150" cy="140" r="135" fill="none" stroke="url(#purpleGrad)" stroke-width="1" opacity="0.4"/>

    <!-- Emblem Card -->
    <rect x="40" y="30" width="220" height="220" rx="30" fill="url(#glassGrad)" stroke="url(#glassBorder)" stroke-width="2" filter="url(#glowCyanFilter)"/>

    <!-- Monogram Graphic Inside Emblem -->
    <g transform="translate(65, 55)" opacity="0.95">
      <!-- R1 -->
      <rect x="25" y="20" width="12" height="110" rx="6" fill="url(#cyanGrad)" />
      <path d="M 35 20 H 70 C 88 20 100 32 100 48 C 100 64 88 76 70 76 H 35 Z" fill="none" stroke="url(#cyanGrad)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M 65 72 L 102 130" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round"/>

      <!-- R2 -->
      <rect x="85" y="20" width="12" height="110" rx="6" fill="url(#purpleGrad)" />
      <path d="M 95 20 H 130 C 148 20 160 32 160 48 C 160 64 148 76 130 76 H 95 Z" fill="none" stroke="url(#purpleGrad)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M 125 72 L 162 130" stroke="url(#purpleGrad)" stroke-width="12" stroke-linecap="round"/>
    </g>

    <!-- Node Points -->
    <circle cx="90" cy="75" r="4" fill="#FFFFFF"/>
    <circle cx="190" cy="75" r="4" fill="#00F0FF"/>
    <circle cx="205" cy="185" r="4" fill="#9D4EDD"/>
  </g>

  <!-- Outer Border Frame -->
  <rect width="1500" height="500" rx="16" fill="none" stroke="#1E293B" stroke-width="2"/>
</svg>
